<!doctype html><html><head><meta charset="UTF-8"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; style-src 'self'; script-src 'self'"><link rel="stylesheet" href="style.css"><title>Screen Companion</title></head><body class="chat-page"><main class="bubble"><header class="bar"><div><span class="status-dot"></span><b>Companion</b><small id="status">Connecting</small></div><button id="hide" class="icon-button" aria-label="Close conversation">×</button></header><section id="messages" aria-live="polite"><div class="welcome" id="welcome"><span class="orbit-symbol">◉</span><h1>What are we looking at?</h1><p id="shortcut">Use Wispr Flow, or type below.</p></div></section><div id="draft" hidden></div><div id="notice" role="status" hidden></div><form id="text-form"><textarea id="text-input" rows="2" maxlength="16000" placeholder="Talk with Wispr, or type…" aria-label="Message your companion"></textarea><div class="compose-footer"><span id="input-state">Wispr Flow · intentional input</span><button id="send" type="submit" class="primary" aria-label="Send message">↑</button></div></form><footer><button id="focus" title="Choose what I look at">◎ Focus</button><button id="draw" title="Draw on your screen">⌁ Draw</button><button id="stop" title="Stop reply">■ Stop</button><button id="settings" aria-label="Open settings">⚙</button></footer></main><script type="module" src="renderer.js"></script></body></html>
